<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <span class="logo">ShopEase</span>
      <a href="admin.html" class="admin-link">Admin →</a>
    </div>
  </header>

  <main class="main">

    <!-- Search + Filter Bar -->
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search by name or tag…" autocomplete="off" />
        <button class="search-clear" id="search-clear" style="display:none">✕</button>
      </div>
      <select class="select" id="sort-select">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="price_asc">Price ↑</option>
        <option value="price_desc">Price ↓</option>
      </select>
    </div>

    <!-- Tag Pills -->
    <div class="tag-row" id="tag-row"></div>

    <!-- Active Tag Filter -->
    <div class="active-tag" id="active-tag" style="display:none">
      Tag: <strong id="active-tag-name"></strong>
      <button id="clear-tag">✕ clear</button>
    </div>

    <!-- Status line -->
    <div class="status-line" id="status-line"></div>

    <!-- Grid -->
    <div class="grid" id="grid"></div>

    <!-- Loading -->
    <div class="loading" id="loading" style="display:none">
      <div class="spinner"></div>
    </div>

    <!-- Empty -->
    <div class="empty" id="empty" style="display:none">
      <p>No products found.</p>
      <button class="btn" id="clear-search">Clear search</button>
    </div>

    <!-- Error -->
    <div class="empty" id="error-state" style="display:none">
      <p id="error-msg">Something went wrong.</p>
      <button class="btn" id="retry-btn">Retry</button>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>

  </main>

  <!-- Modal -->
  <div class="modal-bg" id="modal" style="display:none">
    <div class="modal-box" id="modal-box">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-image-wrap">
        <img id="modal-img" src="" alt="" />
        <div class="modal-no-img" id="modal-no-img" style="display:none">No image</div>
      </div>
      <div class="modal-body">
        <div class="modal-tags" id="modal-tags"></div>
        <h2 id="modal-name"></h2>
        <p id="modal-desc" class="modal-desc"></p>
        <div class="modal-footer">
          <span class="modal-price" id="modal-price"></span>
          <span class="modal-stock" id="modal-stock"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
